[project]
name = "edupath-api"
version = "0.1.0"
description = "EduPath backend: FastAPI + LangGraph modular monolith"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.5",
    "sqlalchemy>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.13",
    "pgvector>=0.3",
    "langgraph>=0.2",
    "langchain-core>=0.3",
    "python-multipart>=0.0.12",
    "sse-starlette>=2.1",
    "structlog>=24.4",
    "httpx>=0.27",
    "networkx>=3.3",
    "pymupdf>=1.24",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "aiosqlite>=0.20",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
