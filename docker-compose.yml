services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edupath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edupath}
      POSTGRES_DB: ${POSTGRES_DB:-edupath}
    ports:
      - "5432:5432"
    volumes:
      - edupath_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edupath}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: ./backend
    environment:
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-edupath}:${POSTGRES_PASSWORD:-edupath}@postgres:5432/${POSTGRES_DB:-edupath}
      REPLAY_MODE: ${REPLAY_MODE:-false}
      DEMO_MODE: ${DEMO_MODE:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      LLM_SMALL_MODEL: ${LLM_SMALL_MODEL:-}
      LLM_MID_MODEL: ${LLM_MID_MODEL:-}
      LLM_STRONG_MODEL: ${LLM_STRONG_MODEL:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-}
      LLM_JSON_MODE: ${LLM_JSON_MODE:-true}
      LLM_REASONING_EFFORT: ${LLM_REASONING_EFFORT:-low}
      LLM_RECORD: ${LLM_RECORD:-false}
      LLM_TIMEOUT_S: ${LLM_TIMEOUT_S:-8}
      HF_TOKEN: ${HF_TOKEN:-}
      EMBEDDING_PROVIDER: ${EMBEDDING_PROVIDER:-none}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-Qwen/Qwen3-Embedding-0.6B}
      VLM_PROVIDER: ${VLM_PROVIDER:-none}
      VLM_MODEL: ${VLM_MODEL:-deepseek-ai/DeepSeek-V4.1-Flash:novita}
      WEB_SEARCH_PROVIDER: ${WEB_SEARCH_PROVIDER:-none}
      TAVILY_API_KEY: ${TAVILY_API_KEY:-}
      WEB_SEARCH_ALLOWED_DOMAINS: ${WEB_SEARCH_ALLOWED_DOMAINS:-}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-insecure-secret-change-me}
      FRONTEND_ORIGIN: http://localhost:3000
      # The curated domain pack lives outside the backend build context; it is mounted read-only and
      # ingested on first start (only when the catalog is empty -- see app/catalog/bootstrap.py).
      DATASET_DIR: /data/dataset
      AUTO_SEED_CATALOG: "true"
      DOCUMENT_STORAGE_DIR: /app/storage/documents
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data:ro
      - edupath_documents:/app/storage/documents
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/api/health', timeout=4).status == 200 else 1)"]
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 40s
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./frontend
      args:
        # Next.js inlines NEXT_PUBLIC_* at BUILD time, so these are build args, not runtime env.
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000}
        NEXT_PUBLIC_DEMO_MODE: ${DEMO_MODE:-false}
    ports:
      - "3000:3000"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  edupath_postgres_data:
  edupath_documents:
