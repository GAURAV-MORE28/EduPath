services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-edupath}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edupath}
      POSTGRES_DB: ${POSTGRES_DB:-edupath}
    ports:
      - "5432:5432"
    volumes:
      - edupath_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-edupath}"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ./backend
    environment:
      ENV: dev
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-edupath}:${POSTGRES_PASSWORD:-edupath}@postgres:5432/${POSTGRES_DB:-edupath}
      REPLAY_MODE: ${REPLAY_MODE:-false}
      DEMO_MODE: ${DEMO_MODE:-false}
      LLM_PROVIDER: ${LLM_PROVIDER:-none}
      LLM_API_KEY: ${LLM_API_KEY:-}
      SESSION_SECRET: ${SESSION_SECRET:-dev-only-insecure-secret-change-me}
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    command: >
      sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./frontend
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  edupath_postgres_data:
